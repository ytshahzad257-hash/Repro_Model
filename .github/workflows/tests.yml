name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' matplotlib
      - run: python -m pytest -q
      - run: python experiments/agent/run_agent_v6_3.py --phase stub --output /tmp/apr_stub_v6_3_ci
      - run: python scripts/verify_earlier_runs_v6_3.py
